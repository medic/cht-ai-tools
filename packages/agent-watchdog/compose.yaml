# Local run of the agent-watchdog image under the constraints the CronJob applies (contracts/container.md, FR-086,
# revision 31): the fixed non-root user, a read-only root filesystem, every capability dropped, no privilege escalation,
# /data and /tmp the only writable paths, CPU and memory limits. Secrets and endpoints come from your own .env
# (`cp .env.example .env`), never from this file; the policy files come from config/local (or the directory in
# AGENT_WATCHDOG_COMPOSE_CONFIG_DIR). Egress: the package refuses its own requests outside `agent-watchdog egress`;
# the cluster's network policy has no local equivalent here, so the runtime subprocess and the Slack SDK are not
# filtered on your machine.
#
#   docker compose build                                              # the image, as CI builds it
#   docker compose run --rm agent-watchdog --version
#   docker compose run --rm agent-watchdog egress --format hosts
#   docker compose run --rm agent-watchdog run --dry-run --date 2026-09-22 > payload.json   # nothing posted
#   docker compose run --rm agent-watchdog run --date 2026-09-22                             # posts to Slack
#   docker compose --profile offline run --rm offline replay --date 2026-09-22 > diff.json   # no network at all
#   docker compose run --rm --entrypoint cat agent-watchdog /data/runs/2026-09-22/rollup/report.html > report.html
#
# The data volume is named (agent-watchdog-data), like the cluster's claim; set AGENT_WATCHDOG_COMPOSE_DATA=./data to
# bind a host directory instead, which must be writable by uid 10001 (`sudo chown 10001:10001 data`).

x-agent-watchdog: &agent-watchdog
  build:
    context: .
    args:
      VERSION: ${AGENT_WATCHDOG_VERSION:-0.0.0-development}
      REVISION: ${AGENT_WATCHDOG_REVISION:-local}
  image: agent-watchdog:local
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=1g,mode=1777
  env_file: .env
  environment:
    AGENT_WATCHDOG_DATA_DIR: /data
    AGENT_WATCHDOG_CONFIG_DIR: /etc/agent-watchdog
    AGENT_WATCHDOG_CORPUS_RAW_DIR: /data/knowledge-corpus/raw
  volumes:
    - ${AGENT_WATCHDOG_COMPOSE_DATA:-data}:/data
    - ${AGENT_WATCHDOG_COMPOSE_CONFIG_DIR:-./config/local}:/etc/agent-watchdog:ro
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2G
        pids: 512
      reservations:
        cpus: "0.5"
        memory: 1G
  stop_grace_period: 2m

services:
  agent-watchdog:
    <<: *agent-watchdog
    command: ["run", "--dry-run"]

  # Replay and single stages need no network (FR-041, FR-043): this service has none at all.
  offline:
    <<: *agent-watchdog
    profiles: ["offline"]
    network_mode: none
    command: ["replay", "--help"]

volumes:
  data:
    name: agent-watchdog-data
