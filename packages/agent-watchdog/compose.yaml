# Local run of the agent-watchdog image under the constraints the CronJob applies (contracts/container.md, FR-086,
# revisions 31 and 32): the fixed non-root user, a read-only root filesystem, every capability dropped, no privilege
# escalation, CPU and memory limits, and only /data, /tmp and the login volume writable. Secrets and endpoints come
# from your own .env (`cp .env.example .env`), never from this file; the policy files come from config/local (or the
# directory in AGENT_WATCHDOG_COMPOSE_CONFIG_DIR). Egress: the package refuses its own requests outside
# `agent-watchdog egress`; the cluster's network policy has no local equivalent here, so the runtime subprocess and
# the Slack SDK are not filtered on your machine.
#
#   docker compose build                                              # the image, as CI builds it
#   docker compose run --rm agent-watchdog --version
#   docker compose run --rm agent-watchdog egress --format hosts
#   docker compose run --rm agent-watchdog run --dry-run --date 2026-09-22 > payload.json   # nothing posted
#   docker compose run --rm agent-watchdog run --date 2026-09-22                             # posts to Slack
#   docker compose --profile offline run --rm offline run --dry-run --stage analyze --date 2026-09-22   # no network
#   docker compose run --rm --entrypoint cat agent-watchdog /data/runs/2026-09-22/rollup/report.html > report.html
#
# Individual use on a Claude subscription (Team plan) instead of an API key: the CLI engine on your own login
# (login mode, contracts/agent-definition.md). Log in once; the login lives in the named volume agent-watchdog-login,
# the runtime user's home, which every service mounts; it holds an OAuth token, so it is never a bind mount and
# `auth logout` clears it. Leave ANTHROPIC_API_KEY blank (a key wins: key mode with --bare ignores the login).
#
#   docker compose --profile login run --rm login                     # `claude auth login`, then follow the prompts
#   docker compose --profile login run --rm login auth status
#   docker compose run --rm -e AGENT_WATCHDOG_ENGINE=cli -e ANTHROPIC_API_KEY= agent-watchdog run --dry-run --date 2026-09-22
#   docker compose --profile login run --rm login auth logout
#
# The data volume is named (agent-watchdog-data), like the cluster's claim; set AGENT_WATCHDOG_COMPOSE_DATA=./data to
# bind a host directory instead, which must be writable by uid 10001 (`sudo chown 10001:10001 data`).

x-agent-watchdog: &agent-watchdog
  build:
    context: .
    args:
      VERSION: ${AGENT_WATCHDOG_VERSION:-0.0.0-development}
      REVISION: ${AGENT_WATCHDOG_REVISION:-local}
  image: agent-watchdog:local
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=1g,mode=1777
  env_file: .env
  environment:
    AGENT_WATCHDOG_DATA_DIR: /data
    AGENT_WATCHDOG_CONFIG_DIR: /etc/agent-watchdog
    AGENT_WATCHDOG_CORPUS_RAW_DIR: /data/knowledge-corpus/raw
    # The runtime's configuration directory in the login volume, where `claude auth login` keeps the login.
    CLAUDE_CONFIG_DIR: /home/watchdog/.claude
  volumes:
    - ${AGENT_WATCHDOG_COMPOSE_DATA:-data}:/data
    - ${AGENT_WATCHDOG_COMPOSE_CONFIG_DIR:-./config/local}:/etc/agent-watchdog:ro
    - login:/home/watchdog
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 2G
        pids: 512
      reservations:
        cpus: "0.5"
        memory: 1G
  stop_grace_period: 2m

services:
  agent-watchdog:
    <<: *agent-watchdog
    command: ["run", "--dry-run"]

  # The stages that need no network (purge, analyze, render, a preview publish; FR-043): this service has none at all.
  # Replay still needs the model, so it runs in the default service.
  offline:
    <<: *agent-watchdog
    profiles: ["offline"]
    network_mode: none
    command: ["run", "--dry-run", "--stage", "analyze"]

  # `claude auth login` once, interactively, into the login volume; `auth status` and `auth logout` the same way.
  login:
    <<: *agent-watchdog
    profiles: ["login"]
    stdin_open: true
    tty: true
    entrypoint: ["claude"]
    command: ["auth", "login"]

volumes:
  data:
    name: agent-watchdog-data
  login:
    name: agent-watchdog-login
