# Global candidate thresholds and severity rules. Initial defaults from the spec (FR-014).
# The system suggests changes as proposals and never edits this file (FR-032).
trailing_days: 14                       # history needed for deviation; below it, unavailable
candidate_rules:
  pct_change_vs_previous_day: 50        # percent, absolute change in either direction
  deviation_sigma_vs_trailing: 2.5      # standard deviations versus the trailing window
  monotonic_rise_hours: 6               # sustained non-decreasing rise ending now
severity:
  default: low
  medium_when:
    - two_or_more_rules_fire
  high_when:                            # fixed list from FR-014; keys are metric roles
    - role: scrape_target
      condition: down
    - role: outbound_push_backlog
      condition: gt
      value: 0
    - role: sentinel_backlog
      condition: gt_multiple_of_baseline
      value: 3
metric_roles:                           # maps roles above to metric keys (research.md R-6)
  scrape_target: up{job="cht"}
  outbound_push_backlog: cht_outbound_push_backlog_count
  sentinel_backlog: cht_sentinel_backlog_count
metric_kinds:                           # how a metric key is analysed (FR-076); the first match wins; anything
  clock: [cht_date_current_millis]      #   built with functions or arithmetic is a gauge. clock: never a candidate
  uptime: [cht_date_uptime_seconds]     #   uptime: a fall below half the previous sample is a restart; no level rule
  counter:                              #   counter: analysed as the increase over each window, never as a level
    - cht_couchdb_doc_total
    - cht_couchdb_doc_del_total
    - cht_couchdb_update_sequence
    - cht_feedback_total
    - cht_api_http_request_duration_seconds_count
    - cht_api_http_response_size_bytes_sum
    - cht_api_http_request_size_bytes_sum
    - cht_api_nodejs_gc_duration_seconds_count
    - cht_api_nodejs_gc_duration_seconds_sum
    - cht_api_process_cpu_seconds_total
display:
  persisting_days_label: persisting {n} days
