# Releases packages/agent-watchdog (research.md R-12): semantic-release runs from the package directory with its
# release.config.js, so semantic-release-monorepo scopes the commit analysis to this package and tags are
# agent-watchdog-v<version>. The root release.yml releases the root package and is not involved. The paths filter
# only avoids no-op runs; the scoping itself is the plugin's.
name: agent-watchdog release

on:
  push:
    branches: [main]
    paths: ['packages/agent-watchdog/**', '.github/workflows/agent-watchdog-release.yml']

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: agent-watchdog-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/agent-watchdog

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/agent-watchdog/.nvmrc
          cache: npm
          cache-dependency-path: packages/agent-watchdog/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
